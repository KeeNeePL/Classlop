[project]
name = "classlop-infra"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aws-cdk-lib>=2.273.0",
    "constructs>=10.8.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
