# One environment, one branch per area. New revision: uv run alembic revision -m "..." --head=<area>@head
[alembic]
script_location = %(here)s/src/classlop/shared/alembic
version_locations = %(here)s/src/classlop/shared/migrations %(here)s/src/classlop/teams/migrations %(here)s/src/classlop/grading/migrations %(here)s/src/classlop/items/migrations %(here)s/src/classlop/dashboard/migrations
path_separator = space
