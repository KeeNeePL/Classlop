<!doctype html>
<!--
PROTOTYPE, throwaway (issue #17). The Classlop AI tab: Chats with named history on the left, like Copilot or ChatGPT.
A Chat only adds Items to the bank: Generation requests in plain words (the AI asks until what, how many,
Difficulty and Item format are clear), Item uploads from an attached file, and follow-ups that change the Chat's Items.
The rejected variants A-C live in commit ea19f7f on branch prototype/17-ai-tab.
The rest of the app is the #12 prototype. Invented data only; the AI is faked and nothing is persisted.
-->
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYP: Classlop AI (#17)</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#1c2128;--muted:#6b7280;--line:#e3e6ea;--accent:#2457d6;--live:#c2410c;--soft:#eef3ff}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
[data-act]{cursor:pointer}
a[data-act]{color:var(--accent)}
.side a[data-act],.slist a[data-act]{color:inherit}
button{font:inherit;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:6px;padding:5px 12px;cursor:pointer}
button.ghost{background:none;color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
input,select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff}
input[type=number]{width:64px;text-align:center}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:12px}
.muted{color:var(--muted)}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:#eceff3;color:#374151;white-space:nowrap}
.badge.live{background:#ffedd5;color:var(--live)}
.badge.warn{background:#fef3c7;color:#92400e}
.badge.exam{background:#fee2e2;color:#991b1b}
.badge.quiz{background:#e0e7ff;color:#3730a3}
.badge.homework{background:#dcfce7;color:#166534}
.badge.e{background:#dcfce7;color:#166534}.badge.m{background:#fef3c7;color:#92400e}.badge.h{background:#fee2e2;color:#991b1b}
.bar{height:8px;background:#eceff3;border-radius:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
h1{font-size:22px;margin:0}
h2{font-size:15px;margin:18px 0 10px}
h2:first-child{margin-top:0}
.trow{display:grid;grid-template-columns:minmax(0,200px) 1fr 44px;gap:12px;align-items:center;padding:5px 0}

.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}
.side{background:#1f2633;color:#d6dbe3;padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.side .logo{color:#fff;font-size:16px;padding:4px 10px 14px}
.side a{display:flex;justify-content:space-between;padding:7px 10px;border-radius:6px}
.side a.on{background:#334155;color:#fff}
.side .label{padding:16px 10px 4px;font-size:11px;text-transform:uppercase;color:#8a94a6}
.count{background:#ef4444;color:#fff;border-radius:99px;font-size:11px;padding:0 7px}
.count:empty{display:none}
main{padding:24px 32px 90px;max-width:1080px}
.chips{display:flex;gap:6px;margin:14px 0}
.chips a{padding:4px 12px;border:1px solid var(--line);border-radius:99px;background:var(--panel)}
.chips a.on{border-color:var(--accent);color:var(--accent)}
.q{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.q .ico{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:11px}
.ico.lesson{background:#ffedd5;color:var(--live)}
.ico.work{background:var(--soft);color:var(--accent)}
.q .btns{display:flex;gap:6px}
.split{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px}
.slist a{display:grid;grid-template-columns:1fr 70px;gap:8px;align-items:center;padding:7px 10px;border-radius:6px}
.slist a.on{background:var(--soft)}
.slist a.all{font-weight:600;border-bottom:1px solid var(--line);border-radius:0;margin-bottom:4px}
.flash{background:#dcfce7;color:#166534;border-radius:8px;padding:8px 12px;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg a{padding:6px 14px;color:inherit!important}
.seg a.on{background:var(--accent);color:#fff!important}
.field{margin:0 0 18px}
.field>label{display:block;font-weight:600;margin-bottom:6px}
.grid td,.grid th{text-align:center}
.grid td:first-child,.grid th:first-child{text-align:left}
.reqs{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:12px}
.item{display:grid;grid-template-columns:30px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item .n{font-weight:700;color:var(--muted)}
.answer{background:#f8fafc;border:1px dashed var(--line);border-radius:6px;padding:8px 10px;margin:6px 0;font-style:italic;color:#475569}
.foot{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
tr[data-act]:hover td{background:#f8fafc}

#bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#111;color:#fff;padding:8px 14px;border-radius:99px;box-shadow:0 6px 24px rgba(0,0,0,.35);font-size:13px;z-index:9;white-space:nowrap}
#bar .tag{background:#facc15;color:#111;font-weight:700;font-size:10px;padding:2px 6px;border-radius:4px}

textarea{font:inherit;border:1px solid var(--line);border-radius:6px;padding:8px;width:100%;resize:vertical}
.steps{margin:6px 0;padding-left:20px;color:var(--muted)}
.steps .ok{color:#166534}.steps .now{color:var(--ink);font-weight:600}
.icard{display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.icard.gone{opacity:.5}
.icard .n{font-weight:700;color:var(--muted)}
.icard .btns{display:flex;gap:6px;align-items:start}
.dup{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px;margin:8px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0}
.chat{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.msg{border-radius:12px;padding:10px 14px}
.msg.me{align-self:flex-end;max-width:70%;background:var(--accent);color:#fff}
.msg.bot{margin-right:12%;background:var(--panel);border:1px solid var(--line)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sugg a{padding:4px 10px;border:1px solid var(--line);border-radius:99px}
main.wide{max-width:none;padding:0}
.cg{display:grid;grid-template-columns:260px minmax(0,1fr);height:100vh}
.clist{background:var(--panel);border-right:1px solid var(--line);padding:12px 8px 80px;overflow:auto}
.clist a[data-act]{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:6px;color:inherit}
.clist a.on{background:var(--soft)}
.clist .ct{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clist .label{padding:14px 10px 4px;font-size:11px;text-transform:uppercase;color:var(--muted)}
.cpane{display:flex;flex-direction:column;min-height:0}
.chead{padding:12px 28px;border-bottom:1px solid var(--line);background:var(--panel)}
#msgs{flex:1;overflow:auto;padding:4px 28px}
#msgs .chat{max-width:860px;margin:16px auto}
.composer{margin:0 auto 72px;width:calc(100% - 56px);max-width:860px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.welcome{text-align:center;margin:10vh auto 0;max-width:640px}
.welcome .sugg{justify-content:center;margin-top:16px}
</style>
</head>
<body>
<div id="app"></div>
<div id="bar"><span class="tag">PROTOTYP</span><span id="bar-label"></span></div>
<script>
// ---------- invented data ----------
function rng(s){return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const r=rng(12);
const TODAY='piątek, 9 października';
const MONTHS=['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
const TOPICS=['Liczby rzeczywiste','Wyrażenia algebraiczne','Równania i nierówności','Układy równań','Funkcje','Ciągi','Trygonometria','Planimetria','Geometria analityczna','Stereometria','Kombinatoryka','Prawdopodobieństwo i statystyka'];
const ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
// Example requirements per dział, for the "zawęź" option; not the real podstawa wording.
const REQS=[['potęgi i pierwiastki','wartość bezwzględna','procenty'],['wzory skróconego mnożenia','rozkład na czynniki','wyrażenia wymierne'],
  ['równania liniowe','nierówności kwadratowe','równania wielomianowe'],['metoda podstawiania','metoda przeciwnych współczynników','zadania tekstowe'],
  ['funkcja liniowa','funkcja kwadratowa','odczytywanie z wykresu'],['ciąg arytmetyczny','ciąg geometryczny','procent składany'],
  ['trójkąt prostokątny','tożsamości','kąty 30°, 45°, 60°'],['trójkąty','kąty w okręgu','czworokąty'],
  ['odległość i środek odcinka','równanie prostej','proste prostopadłe'],['graniastosłupy','ostrosłupy','bryły obrotowe'],
  ['reguła mnożenia','permutacje','zliczanie'],['prawdopodobieństwo klasyczne','średnia i mediana','odchylenie standardowe']];
const POOL=[
  ['Oblicz wartość wyrażenia (2⁻¹ + 3⁻¹)⁻¹.','Zapisz w postaci przedziału zbiór liczb spełniających |x − 2| ≤ 5.','Cenę 240 zł obniżono o 15%, a potem podniesiono o 20%. Oblicz nową cenę.'],
  ['Rozłóż na czynniki wyrażenie x³ − 4x.','Uprość wyrażenie (a + 3)² − (a − 3)².','Wykaż, że dla każdej liczby całkowitej n liczba n² + n jest parzysta.'],
  ['Rozwiąż równanie 3(x − 2) = 2x + 5.','Rozwiąż nierówność x² − 5x + 6 < 0.','Rozwiąż równanie (x − 1)(x² − 9) = 0.'],
  ['Rozwiąż układ równań x + y = 7, x − y = 1.','Rozwiąż układ równań 2x + 3y = 12, x − y = 1.','Trzy zeszyty i dwa długopisy kosztują 19 zł, a zeszyt i cztery długopisy 13 zł. Ile kosztuje zeszyt?'],
  ['Wyznacz miejsca zerowe funkcji f(x) = x² − 5x + 6.','Podaj współrzędne wierzchołka paraboli y = 2(x − 1)² + 3.','Wyznacz wzór funkcji liniowej, której wykres przechodzi przez punkty (0, 2) i (3, 8).'],
  ['Oblicz piąty wyraz ciągu arytmetycznego, w którym a₁ = 3 i r = 4.','Oblicz sumę 10 początkowych wyrazów ciągu aₙ = 2n + 1.','Liczby x, 6, 12 tworzą ciąg geometryczny. Wyznacz x.'],
  ['Kąt α jest ostry i sin α = 3/5. Oblicz cos α.','Oblicz wartość wyrażenia sin²30° + cos²60°.','Przyprostokątne trójkąta mają długości 6 i 8. Oblicz tangens mniejszego kąta ostrego.'],
  ['Oblicz pole trójkąta równobocznego o boku 6.','Kąt wpisany ma miarę 35°. Oblicz kąt środkowy oparty na tym samym łuku.','Oblicz długość przekątnej prostokąta o bokach 5 i 12.'],
  ['Oblicz odległość punktów A = (1, 2) i B = (4, 6).','Wyznacz środek odcinka o końcach (−2, 3) i (4, 7).','Wyznacz równanie prostej prostopadłej do y = 2x + 1, przechodzącej przez (0, 3).'],
  ['Oblicz objętość sześcianu o krawędzi 4.','Oblicz pole powierzchni prostopadłościanu o wymiarach 2 × 3 × 5.','Oblicz długość przekątnej sześcianu o krawędzi 3.'],
  ['Ile jest liczb trzycyfrowych o różnych cyfrach?','Na ile sposobów można ustawić 5 osób w kolejce?','Ile jest liczb dwucyfrowych podzielnych przez 3?'],
  ['Rzucamy dwiema kostkami. Oblicz prawdopodobieństwo, że suma oczek wynosi 7.','Oblicz średnią arytmetyczną liczb 3, 5, 7, 9, 11.','W urnie są 3 kule białe i 5 czarnych. Oblicz prawdopodobieństwo wylosowania białej.']];
const DIFF={e:'łatwe',m:'średnie',h:'trudne'};
const TYPE={quiz:'Kartkówka',exam:'Sprawdzian',homework:'Praca domowa'};
const ST={open:'Zbieranie prac',graded:'Ocenione przez AI',returned:'Zwrócone'};
const FIRST=['Ala','Bartek','Celina','Damian','Ewa','Filip','Gosia','Hubert','Iga','Janek','Kinga','Leon','Maja','Nikola','Oskar','Pola','Rafał','Sara','Tymon','Wiktoria','Zosia','Adam','Bruno','Dorota','Emil','Fabian'];
const CLASSES=[{id:'1a',covered:4,size:26},{id:'2c',covered:7,size:24},{id:'3b',covered:10,size:22}];
for(const c of CLASSES)c.students=Array.from({length:c.size},(_,i)=>{
  const ability=.3+r()*.6;
  return{name:FIRST[(i*5+c.covered)%FIRST.length]+' '+'ABCDGKLMNPRSTWZ'[Math.floor(r()*15)]+'.',att:Math.round(72+r()*28),late:r()<.12,
    prog:Array.from({length:c.covered},()=>Math.round(Math.max(5,Math.min(100,(ability+(r()-.5)*.45)*100))))};
});
// Invented Item bank. Points live on the Item (#11); `used` holds the Classes that already got it.
const BANK=[];
TOPICS.forEach((_,t)=>['e','m','h'].forEach((d,di)=>{
  for(let v=0,n=2+Math.floor(r()*4);v<n;v++){const base=POOL[t][(v+di)%3];
    BANK.push({id:BANK.length,t,d,req:Math.floor(r()*3),pts:{e:1,m:2,h:3}[d]+Math.floor(r()*2),text:v?base.replace(/\d+/,m=>+m+v):base,used:new Set()})}
}));
const shuffle=a=>a.map(x=>[r(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const avail=(cid,t,d,reqs,allowUsed,taken=new Set())=>BANK.filter(b=>!b.retired&&b.t===t&&b.d===d&&(!reqs.length||reqs.includes(b.req))&&(allowUsed||!b.used.has(cid))&&!taken.has(b.id));
const mkItems=(cid,spec)=>spec.flatMap(([t,d,n])=>{const got=shuffle(avail(cid,t,d,[],false)).slice(0,n);got.forEach(b=>b.used.add(cid));return got});
const ASSIGN={
  '1a':[{t:'Wzory skróconego mnożenia',type:'homework',due:'dziś 20:00',sub:17,st:'open',items:mkItems('1a',[[1,'e',2],[1,'m',2]])},
        {t:'Zbiory liczbowe',type:'quiz',due:'6 paź',sub:26,st:'returned',items:mkItems('1a',[[0,'e',2],[0,'m',2]])}],
  '2c':[{t:'Funkcja kwadratowa',type:'exam',due:'7 paź',paper:true,sub:24,st:'graded',items:mkItems('2c',[[4,'e',2],[4,'m',2],[4,'h',1]])},
        {t:'Ciągi: zadania z treścią',type:'homework',due:'13 paź',sub:9,st:'open',items:mkItems('2c',[[5,'m',2],[5,'h',1]])}],
  '3b':[{t:'Graniastosłupy',type:'homework',due:'wczoraj',sub:20,st:'graded',items:mkItems('3b',[[9,'e',2],[9,'m',2],[9,'h',1]])}]
};
const LESSONS=[
  {time:'08:00',cls:'2c',title:'Ciąg arytmetyczny: suma n wyrazów',state:'done'},
  {time:'10:00',cls:'1a',title:'Wzory skróconego mnożenia',state:'live'},
  {time:'12:50',cls:'3b',title:'Graniastosłupy: pola i objętości',state:'next'}
];

// ---------- state ----------
const P=new URLSearchParams(location.search);
const S={view:['home','class','ai'].includes(P.get('view'))?P.get('view'):'ai',cls:P.get('class')||'2c',student:null,filter:'all',
  form:null,draft:null,work:null,sub:null,flash:null,
  ai:{chats:[],turns:[],cid:1,chat:null,text:'',attach:null,nf:0,det:new Set(),q:'',renaming:null,toBottom:true,seeding:false}};

// ---------- helpers ----------
const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
const sum=a=>a.reduce((x,y)=>x+y,0);
const col=p=>`hsl(${p*1.2} 65% 45%)`;
const bar=p=>`<div class="bar"><i style="width:${p}%;background:${col(p)}"></i></div>`;
const badge=(t,k='')=>`<span class="badge ${k}">${t}</span>`;
const CL=id=>CLASSES.find(c=>c.id===id)||CLASSES[0];
const cur=()=>CL(S.cls);
const sAvg=s=>avg(s.prog);
const topicAvg=(c,i)=>avg(c.students.map(s=>s.prog[i]));
const maxPts=a=>sum(a.items.map(it=>it.pts));
const fmtDate=v=>{const d=new Date(v);return d.getDate()+' '+MONTHS[d.getMonth()]};
const why=(p,m)=>p===m?'Poprawna metoda i wynik, pełne uzasadnienie.':p===0?'Brak rozwiązania albo błędna metoda od początku.':p>=m/2?'Poprawna metoda, błąd rachunkowy w końcowym kroku.':'Poprawny pierwszy krok, dalej rozwiązanie urwane.';
// Faked AI grading: one entry per student, null when not handed in.
function subs(c,a){
  if(a.subs)return a.subs;
  const rr=rng(a.t.length*31+c.size);
  return a.subs=c.students.map((s,si)=>si>=a.sub?null:a.items.map(it=>{
    const m=it.pts,p=(s.prog[it.t]??sAvg(s))/100,ai=Math.max(0,Math.min(m,Math.round(m*(p+(rr()-.5)*.5))));
    return{ai,pts:ai};
  }));
}
const score=sb=>sum(sb.map(x=>x.pts));
const workAvg=(c,a)=>{const s=subs(c,a).filter(Boolean);return s.length?Math.round(avg(s.map(score))/maxPts(a)*100):null};
const workRef=(cid,i)=>`work:${cid}:${i}`;

// ---------- home: one prioritised queue ----------
function queue(){
  const q=[];
  for(const l of LESSONS.filter(l=>l.state!=='done'))q.push({kind:'lesson',p:l.state==='live'?0:3,
    title:l.state==='live'?`Trwa lekcja: klasa ${l.cls}`:`${l.time} lekcja: klasa ${l.cls}`,meta:l.title,
    btns:l.state==='live'?[['Dołącz w Teams','noop']]:[['Otwórz klasę','cls:'+l.cls,'ghost']]});
  for(const c of CLASSES)ASSIGN[c.id].forEach((a,i)=>{
    if(a.st==='graded')q.push({kind:'work',p:1,title:`Ocenione przez AI: <a data-act="${workRef(c.id,i)}">${a.t}</a> (${c.id})`,
      meta:`${TYPE[a.type]} · średnio ${workAvg(c,a)}% · oddane ${a.sub}/${c.size}`,btns:[['Zobacz','work:'+c.id+':'+i,'ghost'],['Zwróć w Teams','ret:'+c.id+':'+i]]});
    if(a.st==='open')q.push({kind:'work',p:4,title:`Termin ${a.due}: <a data-act="${workRef(c.id,i)}">${a.t}</a> (${c.id})`,
      meta:`${TYPE[a.type]} · oddane ${a.sub}/${c.size}`,btns:[['Otwórz pracę','work:'+c.id+':'+i,'ghost']]});  });
  return q.sort((x,y)=>x.p-y.p);
}
function home(){
  const f={all:'Wszystko',lesson:'Lekcje',work:'Prace'},q=queue().filter(x=>S.filter==='all'||x.kind===S.filter);
  return `<h1>Dzień dobry</h1><div class="muted">${TODAY} · ${queue().length} rzeczy do zrobienia</div>
    <div class="chips">${Object.entries(f).map(([k,v])=>`<a data-act="filter:${k}" class="${S.filter===k?'on':''}">${v}</a>`).join('')}</div>
    ${q.map(x=>`<div class="q"><div class="ico ${x.kind}">${x.kind==='lesson'?'LEK':'PRA'}</div><div><b>${x.title}</b><div class="muted">${x.meta}</div></div>
      <div class="btns">${x.btns.map(([t,a,k])=>`<button class="${k||''}" data-act="${a}">${t}</button>`).join('')}</div></div>`).join('')||'<div class="muted">Pusto. Wszystko zrobione.</div>'}`;
}

// ---------- class page: overview or one student ----------
function klass(){
  const c=cur();
  return `${S.flash?`<div class="flash">${S.flash}</div>`:''}
    <div class="row"><div><h1>Klasa ${c.id}</h1><div class="muted">${c.size} uczniów · frekwencja ${avg(c.students.map(s=>s.att))}%</div></div>
      <button data-act="new">+ Nowa praca</button></div>
    <div class="split" style="margin-top:16px"><div class="panel slist" style="padding:6px;max-height:620px;overflow:auto">
      <a data-act="student:-1" class="all ${S.student===null?'on':''}"><span>Cała klasa</span>${bar(avg(c.students.map(sAvg)))}</a>

// ---------- Classlop AI: a faked engine; a Chat only adds Items to the bank ----------
const FMT={open:'otwarte',closed:'zamknięte'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Crude stand-in for the AI reading działy, counts, Difficulty and Item format out of free text.
const STEMS=[/rzeczywist|potęg|pierwiast|procent/,/wyrażeni|skrócon/,/nierówn|równani[ea]/,/układ/,/funkcj|parabol/,/ciąg/,
  /trygonometr|sinus|cosinus|tangens/,/planimetr|trójkąt|okręg|czworokąt/,/analityczn|prostej|prostopadł/,/stereometr|graniastosłup|ostrosłup|brył/,
  /kombinator|permutac/,/prawdopodob|statyst|mediana/];
const ORD=['pierwsz','drug','trzec','czwart','piąt','szóst','siódm','ósm','dziewiąt','dziesiąt'];
const one=s=>{const n=s.match(/\b(\d{1,2})\b/);
  return{n:n?Math.max(1,Math.min(20,+n[1])):null,d:/trudn/.test(s)?'h':/łatw/.test(s)?'e':/średni/.test(s)?'m':null,f:/zamknię|testow|wyboru|abcd/.test(s)?'closed':/otwart/.test(s)?'open':null}};
function parseReq(x){
  const s=x.toLowerCase(),parts=s.split(/\s+(?:i|oraz|plus)\s+|,\s*(?=\d)/).map(one).filter(p=>p.n||p.d||p.f);
  return{parts:parts.length?parts:[{n:null,d:null,f:null}],topics:STEMS.map((re,i)=>re.test(s)?i:-1).filter(i=>i>=0)};
}
// An answer to the AI's question fills only what is still missing.
function merge(p,x){
  const q=parseReq(x),a=one(x.toLowerCase());
  p.parts.forEach((pt,i)=>{const src=q.parts.length===p.parts.length&&q.parts.length>1?q.parts[i]:a;for(const k of 'ndf')pt[k]=pt[k]??src[k]});
  if(!p.topics.length)p.topics=q.topics;
}
function missing(p){
  const m=[],many=p.parts.length>1;
  if(!p.topics.length)m.push('z jakiego działu albo na jaki temat');
  p.parts.forEach((pt,i)=>{const w=many?` (część ${i+1})`:'';
    if(!pt.n)m.push('ile zadań'+w);if(!pt.d)m.push('jak trudne: łatwe, średnie czy trudne'+w);if(!pt.f)m.push('otwarte czy zamknięte'+w)});
  return m;
}
const reqTxt=p=>`${p.parts.map(x=>`${x.n} × ${DIFF[x.d]} ${FMT[x.f]}`).join(' i ')}, ${p.topics.map(t=>`${ROMAN[t]}. ${TOPICS[t]}`).join(', ')}`;
const STEPS={gen:['Szukam wzorców w bazie wiedzy','Generuję zadania','Jev sprawdza działy i trudność','Dodaję do banku zadań'],
  upload:['Odczytuję plik','Dzielę na zadania','Uzupełniam odpowiedzi, rozwiązania i punktację','Jev taguje zadania','Szukam podobnych zadań w banku']};
const FILES=[{name:'kartkowka_funkcje_skan.pdf',pages:3,t:4},{name:'zadania_ciagi_zdjecie.jpg',pages:1,t:5}];
const SUGG=['Wygeneruj 5 trudnych zadań otwartych z funkcji kwadratowej','3 łatwe zamknięte i 2 trudne otwarte z ciągów','Zadania z trygonometrii','Przygotuj 4 zadania z pochodnych'];
const chatOf=id=>S.ai.chats.find(c=>c.id===id);
const turnsOf=id=>S.ai.turns.filter(t=>t.chat===id);
const chatItems=id=>turnsOf(id).filter(t=>t.job).flatMap(t=>t.job.items);
function newChat(){const c={id:S.ai.cid++,title:'Nowy czat',when:'dziś',pending:null,last:null};S.ai.chats.push(c);S.ai.chat=c.id;S.ai.toBottom=true;return c}
function say(c,who,o){const t={chat:c.id,who,...o};S.ai.turns.push(t);return t}
// Nudge the last number a little so invented Items differ without turning nonsensical.
const vary=(s,k)=>s.replace(/\d+(?!.*\d)/,m=>+m+1+k%3);
const zadan=n=>n===1?'zadanie':n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?'zadania':'zadań';
const ptsFor=(d,f)=>({e:1,m:2,h:3}[d]+(f==='closed'?0:1));
function addItem(o){const b={id:BANK.length,req:Math.floor(r()*3),pts:ptsFor(o.d,o.f),used:new Set(),flag:null,...o};BANK.push(b);return b}
// Jobs keep running while the Teacher is in another Chat or screen.
function startJob(c,o){
  const j={status:'running',step:0,items:[],skipped:[],dups:[],...o};
  say(c,'ai',{job:j});
  if(c.title==='Nowy czat')c.title=o.kind==='upload'?o.file.name:`${TOPICS[o.req.topics[0]]}: ${sum(o.req.parts.map(p=>p.n))} ${zadan(sum(o.req.parts.map(p=>p.n)))}`;
  if(S.ai.seeding){j.step=STEPS[j.kind].length;finish(j);return}
  const tick=()=>{if(++j.step<STEPS[j.kind].length)setTimeout(tick,700);else finish(j);render()};setTimeout(tick,700);
}
function finish(j){
  j.status='done';
  if(j.kind==='gen'){let k=0;const ts=j.req.topics;
    for(const p of j.req.parts)for(let i=0;i<p.n;i++,k++){const t=ts[k%ts.length];
      j.items.push(addItem({t,d:p.d,f:p.f,origin:'gen',flag:r()<.15?'brak wzorca':null,
        text:vary(POOL[t][k%3],k+S.ai.turns.length)+(p.f==='closed'?' Wybierz jedną odpowiedź: A, B, C albo D.':'')}).id)}
    return}
  // Invented upload: eight exercises; 4 is hard to read, 6 needs a figure, 7 is close to a bank Item, 8 is off the basic level.
  const f=j.file,[lo,hi]=j.range.length?j.range:[1,8],src=n=>`${f.name}, str. ${1+(n-1)%f.pages}`,twin=BANK.find(b=>b.t===f.t&&!b.origin);
  j.found=0;
  for(let n=lo;n<=Math.min(hi,8);n++){j.found++;
    if(n===6)j.skipped.push({n:'Zadanie 6',why:'zależy od rysunku'});
    else if(n===8)j.skipped.push({n:'Zadanie 8',why:'brak działu z zakresu podstawowego'});
    else if(n===7)j.dups.push({n:'Zadanie 7',text:twin.text.replace(/\.$/,', wynik podaj w postaci ułamka.'),of:twin.id,src:src(7),st:null});
    else j.items.push(addItem({t:f.t,d:'emh'[n%3],f:'open',origin:'upload',src:src(n),flag:n===4?'sprawdź odczyt':null,text:vary(POOL[f.t][n%3],n+10)}).id)}
}
// Follow-ups that change this Chat's Items: "dorzuć 3", "zrób trzecie łatwiejsze", "wyrzuć piąte".
function refine(c,x){
  const s=x.toLowerCase(),its=chatItems(c.id);
  if(!its.length)return false;
  if(/dorzuć|jeszcze/.test(s)&&c.last){const o=one(s),l=c.last.parts.at(-1);
    startJob(c,{kind:'gen',req:c.last={topics:c.last.topics,parts:[{n:o.n||l.n,d:o.d||l.d,f:o.f||l.f}]}});return true}
  if(!/łatwiejsz|trudniejsz|popraw|zmień|ma być|źle|wyrzuć|usuń|wycofaj/.test(s))return false;
  const m=s.match(/\b(\d{1,2})\b/),k=m?+m[1]-1:ORD.findIndex(o=>s.includes(o));
  if(!(k in its)){say(c,'ai',{text:`Którego zadania dotyczy poprawka? W tym czacie są zadania 1–${its.length}.`});return true}
  const b=BANK[its[k]];
  if(/wyrzuć|usuń|wycofaj/.test(s)){b.retired=true;say(c,'ai',{text:`Wycofałem zadanie ${k+1} z banku.`});return true}
  if(/łatwiejsz/.test(s))b.d=b.d==='h'?'m':'e';else if(/trudniejsz/.test(s))b.d=b.d==='e'?'m':'h';
  if(/zamknię/.test(s))b.f='closed';else if(/otwart/.test(s))b.f='open';
  b.text=vary(b.text,1);b.pts=ptsFor(b.d,b.f);b.flag=null;b.edited=true;
  say(c,'ai',{text:`Poprawiłem zadanie ${k+1}; Jev sprawdził je ponownie i zmiana jest już w banku.`,items:[b.id]});
  return true;
}
function ask(c){
  const m=missing(c.pending);
  if(m.length)return say(c,'ai',{text:`Zanim wygeneruję, napisz jeszcze: ${m.join('; ')}.`});
  c.last=c.pending;c.pending=null;startJob(c,{kind:'gen',req:c.last});
}
function send(){
  const a=S.ai,x=a.text.trim(),f=a.attach,c=chatOf(a.chat);
  if(!x&&!f)return;
  a.text='';a.attach=null;a.toBottom=true;
  say(c,'me',{text:x,file:f});
  // A file is always an Item upload; the text can only narrow which exercises to take.
  if(f)startJob(c,{kind:'upload',file:f,range:(x.match(/(\d+)\s*[-–]\s*(\d+)/)||[]).slice(1).map(Number)});
  else if(/pochodn|całk|granic|rozszerzon/i.test(x)){c.pending=null;say(c,'ai',{text:'Tego nie wygeneruję: prośba wykracza poza zakres podstawowy liceum.'})}
  else if(c.pending){merge(c.pending,x);ask(c)}
  else if(!refine(c,x)){c.pending=parseReq(x);ask(c)}
}
const aiCount=()=>S.ai.turns.filter(t=>t.job&&(t.job.status==='running'||t.job.dups.some(d=>!d.st))).length;

// ---------- Classlop AI: rendering ----------
const steps=j=>`<ol class="steps">${STEPS[j.kind].map((s,i)=>`<li class="${i<j.step?'ok':i===j.step?'now':''}">${s}</li>`).join('')}</ol>`;
function itemCard(id,cid){
  const b=BANK[id],open=S.ai.det.has(id);
  return`<div class="icard${b.retired?' gone':''}"><span class="n">${chatItems(cid).indexOf(id)+1}.</span><div>${esc(b.text)}
    <div style="margin-top:4px">${badge(ROMAN[b.t]+'. '+TOPICS[b.t])} ${badge(DIFF[b.d],b.d)} ${badge(FMT[b.f])} ${badge(b.pts+' pkt')} ${b.flag?badge(b.flag,'warn'):''} ${b.edited?badge('poprawione'):''} ${b.retired?badge('wycofane'):''}</div>
    ${open?`<div class="answer">Odpowiedź, rozwiązanie wzorcowe i schemat punktowania (przykład). ${b.origin==='upload'?`Źródło: ${b.src}.`:'Wzorce: 3 zadania z bazy wiedzy, widoczne tylko dla nauczyciela.'}</div>`:''}</div>
    <div class="btns"><button class="ghost" data-act="det:${id}">${open?'zwiń':'szczegóły'}</button><button class="ghost" data-act="retire:${id}">${b.retired?'przywróć':'wycofaj'}</button></div></div>`;
}
function jobView(t){
  const j=t.job;
  if(j.status==='running')return steps(j);
  const fl=j.items.filter(id=>BANK[id].flag).length;
  const head=j.kind==='gen'?`Dodano do banku <b>${j.items.length}</b> ${zadan(j.items.length)} (${reqTxt(j.req)})${fl?`, ${fl} oznaczone`:''}.`
    :`<b>${j.file.name}</b>: ${j.found} zadań${j.range.length?` (${j.range.join('–')})`:''}. Dodano <b>${j.items.length}</b>${fl?` (${fl} oznaczone)`:''}, pominięto ${j.skipped.length}, podobne do zadań z banku: ${j.dups.length}.`;
  return`<div>${head}</div>
    ${j.dups.map((x,k)=>`<div class="dup"><b>${x.n}</b> jest podobne do zadania z banku.
      <div class="two"><div><div class="muted">Z pliku (${x.src})</div>${esc(x.text)}</div><div><div class="muted">W banku</div>${esc(BANK[x.of].text)}</div></div>
      ${x.st?`<span class="muted">${x.st==='keep'?'Wgrane mimo to.':'Pominięte.'}</span>`:`<button data-act="dup:${S.ai.turns.indexOf(t)}:${k}:keep">Wgraj mimo to</button> <button class="ghost" data-act="dup:${S.ai.turns.indexOf(t)}:${k}:drop">Pomiń</button>`}</div>`).join('')}
    <div>${j.items.map(id=>itemCard(id,t.chat)).join('')}</div>
    ${j.skipped.length?`<div class="muted" style="margin-top:8px">Pominięte: ${j.skipped.map(x=>`${x.n} (${x.why})`).join(', ')}.</div>`:''}`;
}
const turnView=t=>t.who==='me'?`<div class="msg me">${t.file?`Plik: <b>${t.file.name}</b>${t.text?'<br>':''}`:''}${esc(t.text)}</div>`
  :`<div class="msg bot">${t.job?jobView(t):esc(t.text)}${t.items?t.items.map(id=>itemCard(id,t.chat)).join(''):''}</div>`;
function ai(){
  const a=S.ai,c=chatOf(a.chat),ts=turnsOf(c.id),q=a.q.toLowerCase();
  let last='';
  const list=[...a.chats].reverse().filter(x=>(x.id===a.chat||turnsOf(x.id).length)&&(!q||x.title.toLowerCase().includes(q))).map(x=>{
    const xj=turnsOf(x.id).filter(t=>t.job).map(t=>t.job),h=x.when!==last?`<div class="label">${x.when}</div>`:'';last=x.when;
    const tag=xj.some(j=>j.status==='running')?badge('w toku','quiz'):xj.some(j=>j.dups.some(d=>!d.st))?badge('do decyzji','warn'):'';
    return h+(a.renaming===x.id?`<input id="ren" value="${esc(x.title)}" style="width:100%;margin:2px 0">`
      :`<a data-act="chat:${x.id}" class="${x.id===a.chat?'on':''}"><span class="ct">${esc(x.title)}</span>${tag}</a>`)}).join('');
  const welcome=`<div class="welcome"><h1>Jakie zadania przygotować?</h1><div class="muted" style="margin-top:6px">Napisz, z jakiego działu, ile, jak trudne i czy otwarte, czy zamknięte. Albo załącz plik z zadaniami, a trafią do banku.</div>
    <div class="sugg">${SUGG.map((s,i)=>`<a data-act="sugg:${i}">${s}</a>`).join('')}</div></div>`;
  return`<div class="cg"><div class="clist"><button style="width:100%;margin-bottom:8px" data-act="newchat">+ Nowy czat</button>
      <input id="chat-q" data-f="chatq" placeholder="Szukaj w czatach" value="${esc(a.q)}" style="width:100%">${list||'<div class="muted" style="padding:10px">Brak czatów.</div>'}</div>
    <div class="cpane"><div class="chead row"><b>${esc(c.title)}</b>${ts.length?`<span class="muted" style="font-size:12px"><a data-act="ren:${c.id}">zmień nazwę</a> · <a data-act="delchat:${c.id}">usuń</a></span>`:''}</div>
      <div id="msgs"><div class="chat">${ts.length?ts.map(turnView).join(''):welcome}</div></div>
      <div class="composer">${a.attach?`<div><span class="badge">Plik: ${a.attach.name} <a data-act="unattach">×</a></span></div>`:''}
        <textarea id="ai-in" data-f="aitext" rows="2" placeholder="${c.pending?'Odpowiedz na pytanie AI':'Np. 6 średnich zadań otwartych z ciągu arytmetycznego'} (Enter wysyła)">${esc(a.text)}</textarea>
        <div class="row"><button class="ghost" data-act="attach">Załącz plik</button>
          <span class="muted" style="font-size:12px">Poprawki: „zrób 3 łatwiejsze”, „dorzuć 2”, „wyrzuć 5”</span><button data-act="send">Wyślij</button></div></div></div></div>`;
}
function seed(){
  const a=S.ai,chat=(when,msgs)=>{const c=newChat();for(const m of msgs){if(m.file)a.attach=m.file;a.text=m.text||'';send()}c.when=when};
  a.seeding=true;
  chat('zeszły tydzień',[{text:'Ułóż 8 łatwych zadań zamkniętych z procentów'}]);
  chat('poniedziałek',[{text:'Zadania z trygonometrii'},{text:'4, średnie, otwarte'},{text:'zrób drugie łatwiejsze'}]);
  chat('wczoraj',[{file:FILES[0]}]);
  chat('dziś',[{text:'Wygeneruj 5 trudnych zadań otwartych z funkcji kwadratowej'}]);
  a.seeding=false;
  newChat();
}

// ---------- wiring ----------
const VIEWS={home,class:klass,new:form,preview,work,sub:submission,ai};
const LABEL={home:'pulpit',class:'strona klasy',new:'nowa praca',preview:'podgląd zadań',work:'praca oceniona przez AI',sub:'praca ucznia',ai:'Classlop AI'};
function render(){
  try{const top=['home','ai'].includes(S.view),p=new URLSearchParams({view:top?S.view:'class'});if(!top)p.set('class',S.cls);history.replaceState(null,'','?'+p)}catch{}
  const graded=c=>ASSIGN[c.id].filter(a=>a.st==='graded').length;
  // Re-rendering replaces the DOM; keep the caret where the Teacher is typing and follow new messages unless they scrolled up.
  const fe=document.activeElement,fid=fe&&fe.id,s0=fe&&fe.selectionStart,s1=fe&&fe.selectionEnd;
  const m0=document.getElementById('msgs'),stick=S.ai.toBottom||!m0||m0.scrollHeight-m0.scrollTop-m0.clientHeight<60,top=m0&&m0.scrollTop;
  document.getElementById('app').innerHTML=`<div class="shell"><aside class="side"><b class="logo" data-act="home">Classlop</b>
    <a data-act="home" class="${S.view==='home'?'on':''}">Do zrobienia <span class="count">${queue().length}</span></a>
    <a data-act="ai" class="${S.view==='ai'?'on':''}">Classlop AI <span class="count">${aiCount()||''}</span></a>
    <div class="label">Klasy</div>
    ${CLASSES.map(c=>`<a data-act="cls:${c.id}" class="${!['home','ai'].includes(S.view)&&S.cls===c.id?'on':''}">Klasa ${c.id}<span class="count">${graded(c)||''}</span></a>`).join('')}
  </aside><main class="${S.view==='ai'?'wide':''}">${VIEWS[S.view]()}</main></div>`;
  const el=fid&&document.getElementById(fid);
  if(el){el.focus();try{el.setSelectionRange(s0,s1)}catch{}}
  const m1=document.getElementById('msgs');
  if(m1)m1.scrollTop=stick?m1.scrollHeight:top;
  S.ai.toBottom=false;
  document.getElementById('bar-label').textContent=`${LABEL[S.view]} · bank: ${BANK.filter(b=>!b.retired).length} zadań, z Classlop AI ${BANK.filter(b=>b.origin&&!b.retired).length} · dane wymyślone, nic nie jest zapisywane`;
  S.flash=null;
}
function draftFromForm(){
  const f=S.form,c=cur(),items=[],need=[];
  for(const x of f.rows)for(const d of ['e','m','h']){
    if(!x[d])continue;
    const got=shuffle(avail(c.id,x.t,d,x.req,f.allowUsed)).slice(0,x[d]);
    items.push(...got);
    if(got.length<x[d])need.push({t:x.t,d,n:x[d]-got.length});
  }
  return{cls:c.id,type:f.type,title:f.titleTouched&&f.title.trim()?f.title:autoTitle(f),due:'',allowUsed:f.allowUsed,
    forWhom:f.who==='all'?'cała klasa':`${f.students.size} wybranych uczniów`,items,need,noAlt:null};
}
const ACT={
  noop:()=>{},
  home:()=>{S.view='home'},
  cls:id=>{S.view='class';S.cls=id;S.student=null},
  filter:k=>{S.filter=k},
  student:i=>{S.student=+i<0?null:+i},
  ai:()=>{S.view='ai';S.ai.toBottom=true},
  chat:id=>{S.ai.chat=+id;S.ai.renaming=null;S.ai.toBottom=true},
  newchat:()=>{if(turnsOf(S.ai.chat).length)newChat()},
  ren:id=>{S.ai.renaming=+id},
  delchat:id=>{const a=S.ai;a.chats=a.chats.filter(c=>c.id!==+id);a.turns=a.turns.filter(t=>t.chat!==+id);
    if(a.chat===+id){if(a.chats.length){a.chat=a.chats.at(-1).id;a.toBottom=true}else newChat()}},
  new:()=>{S.form={type:'quiz',title:'',titleTouched:false,rows:[],who:'all',students:new Set(),allowUsed:false};S.view='new'},
  type:k=>{S.form.type=k},
  narrow:ri=>{const x=S.form.rows[ri];x.open=!x.open},
  rmrow:ri=>{S.form.rows.splice(+ri,1)},
  who:k=>{S.form.who=k},
  pickall:on=>{S.form.students=new Set(+on?cur().students.map((_,i)=>i):[])},
  generate:()=>{S.draft=draftFromForm();S.view='preview'},
  backform:()=>{S.view='new'},
  reroll:i=>{const d=S.draft,it=d.items[i],alt=shuffle(avail(d.cls,it.t,it.d,[],d.allowUsed,new Set(d.items.map(x=>x.id))))[0];
    if(alt){d.items[i]=alt;d.noAlt=null}else d.noAlt=+i},
  delitem:i=>{S.draft.items.splice(+i,1);S.draft.noAlt=null},
  save:()=>{const d=S.draft,a={t:d.title,type:d.type,items:d.items,st:'open',sub:0,due:d.due?fmtDate(d.due):'bez terminu'};
    d.items.forEach(b=>b.used.add(d.cls));ASSIGN[d.cls].push(a);
    S.view='class';S.cls=d.cls;S.student=null;S.flash=`Opublikowano „${a.t}” w Teams (na niby).`;S.draft=null},
  work:(cid,i)=>{S.cls=cid;S.work={cid,i:+i};S.view='work'},
  sub:si=>{S.sub=+si;S.view='sub'},
  ret:(cid,i)=>{ASSIGN[cid][i].st='returned'},
  sugg:i=>{S.ai.text=SUGG[i]},
  attach:()=>{S.ai.attach=FILES[S.ai.nf++%FILES.length]},
  unattach:()=>{S.ai.attach=null},
  send,
  det:id=>{const s=S.ai.det,n=+id;s.has(n)?s.delete(n):s.add(n)},
  retire:id=>{BANK[id].retired=!BANK[id].retired},
  dup:(ti,k,v)=>{const j=S.ai.turns[ti].job,x=j.dups[k],b=BANK[x.of];x.st=v;
    if(v==='keep')j.items.push(addItem({t:b.t,d:b.d,f:'open',origin:'upload',src:x.src,text:x.text}).id)}
};
const FIELD={
  title:v=>{S.form.title=v;S.form.titleTouched=true},
  cnt:(v,ri,d)=>{S.form.rows[ri][d]=Math.max(0,parseInt(v)||0);liveTotals()},
  due:v=>{S.draft.due=v},
  pts:(v,k,_,el)=>{const {cid,i}=S.work,a=ASSIGN[cid][i],y=subs(CL(cid),a)[S.sub][k];
    y.pts=Math.max(0,Math.min(a.items[k].pts,parseInt(v)||0));
    document.getElementById('score').textContent=score(subs(CL(cid),a)[S.sub]);
    document.getElementById('ed-'+k).textContent=y.pts!==y.ai?'zmieniono':''},
  aitext:v=>{S.ai.text=v},
  chatq:v=>{S.ai.q=v;render()}
};
const CHANGE={
  addrow:v=>{if(v!=='')S.form.rows.push({t:+v,e:0,m:0,h:0,req:[],open:false})},
  allowused:()=>{S.form.allowUsed=!S.form.allowUsed},
  req:(_,ri,j)=>{const x=S.form.rows[ri].req,n=+j;x.includes(n)?x.splice(x.indexOf(n),1):x.push(n)},
  stu:(_,i)=>{const s=S.form.students,n=+i;s.has(n)?s.delete(n):s.add(n)}
};
document.addEventListener('keydown',e=>{
  const id=e.target.id;
  if(id==='ren'&&(e.key==='Enter'||e.key==='Escape')){const c=chatOf(S.ai.renaming),v=e.target.value.trim();
    if(e.key==='Enter'&&v)c.title=v;S.ai.renaming=null;render();return}
  if(id==='ai-in'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();render()}
});
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const[a,...args]=t.dataset.act.split(':');if(!ACT[a])return;ACT[a](...args);render()});
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;const[k,...args]=f.split(':');FIELD[k](e.target.value,...args)});
document.addEventListener('change',e=>{const f=e.target.dataset.c;if(!f)return;const[k,...args]=f.split(':');CHANGE[k](e.target.value,...args);render()});
seed();
render();
</script>
